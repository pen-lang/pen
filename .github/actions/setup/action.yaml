name: pen/setup
description: Sets up a build environment
inputs: {}
outputs: {}
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v7.0.0
      with:
        go-version: stable
    - uses: swatinem/rust-cache@v2.9.3
    - uses: raviqqe/enable-homebrew@v1.0.6
      with:
        stable: true
    - run: tools/ci/github/setup.sh
      shell: bash
