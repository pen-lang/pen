version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: daily
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: daily
  - package-ecosystem: npm
    directory: /doc
    schedule:
      interval: daily
  - package-ecosystem: rust-toolchain
    directories:
      - /
      - /packages/core/ffi
      - /packages/http/ffi
      - /packages/json/ffi
      - /packages/os-sync/ffi
      - /packages/os/ffi/application
      - /packages/os/ffi/library
      - /packages/prelude/ffi
      - /packages/sql/ffi
    groups:
      rust-toolchain:
        group-by: dependency-name
        patterns:
          - "*"
    schedule:
      interval: daily
  - package-ecosystem: uv
    directory: /doc
    schedule:
      interval: daily
  - package-ecosystem: cargo
    directories:
      - /
      - /cmd/test
      - /packages/core/ffi
      - /packages/html/ffi
      - /packages/http/ffi
      - /packages/json/ffi
      - /packages/os-sync/ffi
      - /packages/os/ffi/application
      - /packages/os/ffi/library
      - /packages/prelude/ffi
      - /packages/random/ffi
      - /packages/regex/ffi
      - /packages/sql/ffi
      - /packages/test/ffi
    groups:
      cargo:
        group-by: dependency-name
        patterns:
          - "*"
      cargo-security:
        applies-to: security-updates
        group-by: dependency-name
        patterns:
          - "*"
    schedule:
      interval: daily
