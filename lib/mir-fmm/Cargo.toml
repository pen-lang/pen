[package]
name = "mir-fmm"
description = "MIR to F-- compiler"
version = "0.1.0"
publish = false
license = "MIT"
edition = "2024"

[dependencies]
fmm = { git = "https://github.com/raviqqe/fmm", branch = "main" }
fnv = "1.0.7"
mir = { path = "../mir" }
plist = { git = "https://github.com/raviqqe/plist-rs", branch = "main" }

[dev-dependencies]
insta = "1.41.1"
tempfile = "3.27.0"
fmm-c = { git = "https://github.com/raviqqe/fmm", branch = "main" }
fmm-llvm = { git = "https://github.com/raviqqe/fmm", branch = "main" }
