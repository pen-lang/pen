[package]
name = "infra"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
app = { path = "../app" }
glob = "0.3.4"
regex = "1.13.1"
rlimit = "0.12.0"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
termcolor = "1.4.1"
test-info = { path = "../test-info" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync"] }
turtle-build = "0.5.19"
url = "2.5.8"
which = "8.0.5"

[dev-dependencies]
tempfile = "3.27.0"
