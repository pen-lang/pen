[package]
name = "os"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
ffi = { package = "pen-ffi", version = "0.10.26", features = ["runtime", "std"] }
futures = "0.3.34"
tokio = {
  version = "1.53.1",
  features = [
    "fs",
    "io-std",
    "io-util",
    "net",
    "process",
    "rt",
    "sync",
    "time",
  ]
}
