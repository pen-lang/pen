[package]
name = "pen-sql"
version = "0.1.0"
publish = false
edition = "2024"

[lib]
crate-type = ["staticlib"]

[dependencies]
ffi = { package = "pen-ffi", version = "0.10.26", features = ["runtime", "std"] }
futures = "0.3.34"
sqlx = { version = "0.9.0", features = [
  "any",
  "mysql",
  "postgres",
  "sqlite-bundled",
  "runtime-tokio",
  "tls-rustls",
] }
