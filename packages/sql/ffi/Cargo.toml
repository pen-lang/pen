[package]
name = "pen-sql"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
ffi = { package = "pen-ffi", version = "0.10.26", features = ["runtime", "std"] }
futures = "0.3.34"
sqlx = {
  version = "0.9.0",
  features = [
    "any",
    "mysql",
    "postgres",
    "runtime-tokio",
    "sqlite-bundled",
    "tls-rustls",
  ]
}
