[package]
name = "pen-sql"
version = "0.1.0"
publish = false
edition = "2021"

[lib]
crate-type = ["staticlib"]

[dependencies]
ffi = { package = "pen-ffi", version = "0.10.23", features = ["runtime", "std"] }
futures = "0.3.34"
sqlx = { version = "0.8.6", features = [
  "any",
  "mysql",
  "postgres",
  "sqlite",
  "runtime-tokio-rustls",
] }
tokio = { version = "1.37.0", features = ["net", "rt-multi-thread", "time"] }
