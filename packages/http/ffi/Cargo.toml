[package]
name = "pen-http"
version = "0.1.0"
publish = false
edition = "2024"

[lib]
crate-type = ["staticlib"]

[dependencies]
ffi = { package = "pen-ffi", version = "0.10.26", features = ["runtime", "std"] }
futures = "0.3.34"
hyper = { version = "0.14.32", features = [
  "client",
  "http1",
  "http2",
  "server",
  "tcp",
] }
